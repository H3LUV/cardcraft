name: Enable Cardcraft Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-enable.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages workflow build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let ready = false;
            let html_url = '';
            let action = '';
            let errorInfo = null;
            try {
              try {
                const current = await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
                html_url = current.data.html_url || '';
                action = 'existing';
                try {
                  await github.request('PUT /repos/{owner}/{repo}/pages', {
                    owner, repo, build_type: 'workflow'
                  });
                  action = 'updated';
                } catch (updateError) {
                  if (![409, 422].includes(updateError.status)) throw updateError;
                }
                ready = true;
              } catch (getError) {
                if (getError.status !== 404) throw getError;
                const created = await github.request('POST /repos/{owner}/{repo}/pages', {
                  owner, repo, build_type: 'workflow'
                });
                html_url = created.data.html_url || '';
                action = 'created';
                ready = true;
              }
            } catch (error) {
              errorInfo = { status: error.status || null, message: error.message || String(error) };
            }
            const path = '.deploy/pages-probe.json';
            const payload = JSON.stringify({
              ready,
              action,
              html_url,
              error: errorInfo,
              source_sha: context.sha,
              recorded_at: new Date().toISOString()
            }, null, 2) + '\n';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'chore: record Pages enable probe [skip ci]',
              content: Buffer.from(payload).toString('base64'),
              sha
            });
