name: Apply Cardcraft source bundle

on:
  push:
    branches: [main]
    paths:
      - '.cardcraft-payload/READY'

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate Cardcraft V10
        shell: bash
        run: |
          set -euo pipefail
          test -f .cardcraft-payload/READY
          cat .cardcraft-payload/part-*.b64 | base64 --decode > /tmp/cardcraft-source.zip
          unzip -oq /tmp/cardcraft-source.zip -d .
          rm -rf .cardcraft-payload
          rm -f .github/workflows/apply-cardcraft-source.yml
          node --check src/index.js
          grep -q "GEMINI_API_KEY" src/index.js
          grep -q "generativelanguage.googleapis.com" src/index.js
          grep -q '"main": "./src/index.js"' wrangler.jsonc
          grep -q 'run_worker_first' wrangler.jsonc
          grep -q 'CARDCRAFT V10' public/index.html
          grep -q "statusEndpoint: '/api/ai/status'" public/ai-config.js
      - name: Commit standalone source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Install standalone Cardcraft V10 Gemini Worker source"
          git push origin HEAD:main
