name: Deploy Cardcraft Worker

on:
  push:
    branches: [main]
    paths-ignore:
      - '.deploy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Deploy with Wrangler
        id: wrangler
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret is configured." >&2
            exit 78
          fi
          npx wrangler deploy 2>&1 | tee wrangler-output.txt
      - name: Record deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          WRANGLER_OUTCOME: ${{ steps.wrangler.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.deploy/cloudflare-status.json';
            let output = '';
            try { output = fs.readFileSync('wrangler-output.txt', 'utf8'); } catch (_) {}
            const urlMatch = output.match(/https:\/\/[^\s]+\.workers\.dev/i);
            const payload = JSON.stringify({
              status: process.env.WRANGLER_OUTCOME === 'success' ? 'deployed' : 'failed',
              outcome: process.env.WRANGLER_OUTCOME,
              url: urlMatch ? urlMatch[0] : '',
              source_sha: context.sha,
              output_tail: output.slice(-2500),
              recorded_at: new Date().toISOString()
            }, null, 2) + '\n';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: record Cloudflare deployment [skip ci]',
              content: Buffer.from(payload).toString('base64'),
              sha
            });
