name: Probe Cardcraft Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cloudflare Worker URL
        id: probe
        shell: bash
        run: |
          URL='https://cardcraft.ahrvks.workers.dev/'
          STATUS=''
          LIVE='false'
          VERSION='unknown'
          NATIVE_RUNTIME='false'
          for i in $(seq 1 24); do
            STATUS=$(curl -L -sS -o /tmp/cardcraft-live.html -w '%{http_code}' --max-time 20 "$URL" || true)
            BODY=$(head -c 350000 /tmp/cardcraft-live.html 2>/dev/null || true)
            MON_STATUS=$(curl -L -sS -o /tmp/cardcraft-mon.js -w '%{http_code}' --max-time 20 "${URL}monetization.js?v=12.1" || true)
            MON_BODY=$(head -c 100000 /tmp/cardcraft-mon.js 2>/dev/null || true)
            BRIDGE_STATUS=$(curl -L -sS -o /tmp/cardcraft-bridge.js -w '%{http_code}' --max-time 20 "${URL}native-app-bridge.js?v=12.1" || true)
            if [ "$STATUS" = "200" ] && echo "$BODY" | grep -q 'v12.js?v=12.1' && echo "$BODY" | grep -q 'native-app-bridge.js?v=12.1'; then
              LIVE='true'
              VERSION='v12.1'
              if [ "$MON_STATUS" = '200' ] && echo "$MON_BODY" | grep -q 'nativeBillingConfigured' && [ "$BRIDGE_STATUS" = '200' ]; then NATIVE_RUNTIME='true'; fi
              break
            fi
            sleep 15
          done
          HEALTH_STATUS=$(curl -L -sS -o /tmp/cardcraft-health.json -w '%{http_code}' --max-time 20 "${URL}health" || true)
          SESSION_STATUS=$(curl -L -sS -o /tmp/cardcraft-session.json -w '%{http_code}' --max-time 20 "${URL}api/session" || true)
          HEALTH_BODY=$(head -c 2000 /tmp/cardcraft-health.json 2>/dev/null || true)
          SESSION_BODY=$(head -c 5000 /tmp/cardcraft-session.json 2>/dev/null || true)
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "native_runtime=$NATIVE_RUNTIME" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS:-000}" >> "$GITHUB_OUTPUT"
          echo "health_status=${HEALTH_STATUS:-000}" >> "$GITHUB_OUTPUT"
          echo "session_status=${SESSION_STATUS:-000}" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "health_ok=$([ "$HEALTH_STATUS" = '200' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "session_ok=$([ "$SESSION_STATUS" = '200' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          printf '%s' "$HEALTH_BODY" > /tmp/health-body.txt
          printf '%s' "$SESSION_BODY" > /tmp/session-body.txt

      - name: Record probe result
        uses: actions/github-script@v7
        env:
          LIVE: ${{ steps.probe.outputs.live }}
          VERSION: ${{ steps.probe.outputs.version }}
          NATIVE_RUNTIME: ${{ steps.probe.outputs.native_runtime }}
          HTTP_STATUS: ${{ steps.probe.outputs.status }}
          HEALTH_STATUS: ${{ steps.probe.outputs.health_status }}
          SESSION_STATUS: ${{ steps.probe.outputs.session_status }}
          HEALTH_OK: ${{ steps.probe.outputs.health_ok }}
          SESSION_OK: ${{ steps.probe.outputs.session_ok }}
          LIVE_URL: ${{ steps.probe.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.deploy/live-probe.json';
            const payload = JSON.stringify({
              live: process.env.LIVE === 'true',
              version: process.env.VERSION,
              native_runtime: process.env.NATIVE_RUNTIME === 'true',
              http_status: process.env.HTTP_STATUS,
              health: {
                ok: process.env.HEALTH_OK === 'true',
                status: process.env.HEALTH_STATUS,
                body: fs.existsSync('/tmp/health-body.txt') ? fs.readFileSync('/tmp/health-body.txt','utf8').slice(0,1000) : ''
              },
              session: {
                ok: process.env.SESSION_OK === 'true',
                status: process.env.SESSION_STATUS,
                body: fs.existsSync('/tmp/session-body.txt') ? fs.readFileSync('/tmp/session-body.txt','utf8').slice(0,2000) : ''
              },
              url: process.env.LIVE_URL,
              source_sha: context.sha,
              recorded_at: new Date().toISOString()
            }, null, 2) + '\n';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: record Cardcraft live probe [skip ci]',
              content: Buffer.from(payload).toString('base64'),
              sha
            });
