name: Cardcraft Deploy Heartbeat

on:
  push:
    branches: [main]
    paths-ignore:
      - '.deploy/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.deploy/heartbeat.json';
            const payload = JSON.stringify({
              status: 'actions-running',
              source_sha: context.sha,
              recorded_at: new Date().toISOString()
            }, null, 2) + '\n';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: record actions heartbeat [skip ci]',
              content: Buffer.from(payload).toString('base64'),
              sha
            });
