name: Verify Cardcraft V12.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v124-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed V12.4 style parity
        id: smoke
        shell: bash
        run: |
          BASE='https://cardcraft.ahrvks.workers.dev'
          OK='false'
          for i in $(seq 1 24); do
            JS=$(curl -L -sS -o /tmp/v124.js -w '%{http_code}' --max-time 20 "$BASE/v12.4-style-parity.js" || true)
            CSS=$(curl -L -sS -o /tmp/v124.css -w '%{http_code}' --max-time 20 "$BASE/v12.4-style-parity.css" || true)
            CFG=$(curl -L -sS -o /tmp/config.js -w '%{http_code}' --max-time 20 "$BASE/monetization-config.js" || true)
            if [ "$JS" = '200' ] && [ "$CSS" = '200' ] && [ "$CFG" = '200' ] && grep -q 'cardcraftV124StyleParity' /tmp/v124.js && grep -q 'v12.4-style-parity.js' /tmp/config.js; then
              OK='true'; break
            fi
            sleep 15
          done
          HEALTH=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BASE/health" || true)
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "js=$JS" >> "$GITHUB_OUTPUT"
          echo "css=$CSS" >> "$GITHUB_OUTPUT"
          echo "cfg=$CFG" >> "$GITHUB_OUTPUT"
          echo "health=$HEALTH" >> "$GITHUB_OUTPUT"

      - name: Record result
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.smoke.outputs.ok }}
          JS: ${{ steps.smoke.outputs.js }}
          CSS: ${{ steps.smoke.outputs.css }}
          CFG: ${{ steps.smoke.outputs.cfg }}
          HEALTH: ${{ steps.smoke.outputs.health }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path='.deploy/v124-smoke.json';
            const payload=JSON.stringify({
              ok:process.env.OK==='true',version:'12.4',url:'https://cardcraft.ahrvks.workers.dev/',
              js_status:process.env.JS,css_status:process.env.CSS,config_status:process.env.CFG,health_status:process.env.HEALTH,
              features:['same-1000-pool-both-faces','same-style-cards-both-faces','front-match-default','face-aware-library'],
              source_sha:context.sha,recorded_at:new Date().toISOString()
            },null,2)+'\n';
            let sha;
            try{const cur=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path});sha=cur.data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'chore: record V12.4 smoke [skip ci]',content:Buffer.from(payload).toString('base64'),sha});
