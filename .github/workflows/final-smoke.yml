name: Cardcraft Final Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Cardcraft V12.1
        id: smoke
        shell: bash
        run: |
          set +e
          URL='https://cardcraft.ahrvks.workers.dev/'
          OK='false'
          DETAIL='not-ready'
          for i in $(seq 1 30); do
            INDEX_STATUS=$(curl -L -sS -o /tmp/index.html -w '%{http_code}' --max-time 20 "$URL")
            CONFIG_STATUS=$(curl -L -sS -o /tmp/mon-config.js -w '%{http_code}' --max-time 20 "${URL}monetization-config.js?v=12.1")
            BRIDGE_STATUS=$(curl -L -sS -o /tmp/native-bridge.js -w '%{http_code}' --max-time 20 "${URL}native-app-bridge.js?v=12.1")
            MON_STATUS=$(curl -L -sS -o /tmp/monetization.js -w '%{http_code}' --max-time 20 "${URL}monetization.js?v=12.1")
            V12_STATUS=$(curl -L -sS -o /tmp/v12.js -w '%{http_code}' --max-time 20 "${URL}v12.js?v=12.1")
            HEALTH_STATUS=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "${URL}health")
            SESSION_STATUS=$(curl -L -sS -o /tmp/session.json -w '%{http_code}' --max-time 20 "${URL}api/session")

            if [ "$INDEX_STATUS" = '200' ] && \
               grep -q 'native-app-bridge.js?v=12.1' /tmp/index.html && \
               grep -q 'v12.js?v=12.1' /tmp/index.html && \
               [ "$CONFIG_STATUS" = '200' ] && grep -q 'monetization.js?v=12.1' /tmp/mon-config.js && \
               [ "$BRIDGE_STATUS" = '200' ] && grep -q 'nativePromise' /tmp/native-bridge.js && \
               [ "$MON_STATUS" = '200' ] && grep -q 'nativeBillingConfigured' /tmp/monetization.js && grep -q 'cardcraft_export_png' /tmp/monetization.js && \
               [ "$V12_STATUS" = '200' ] && grep -q 'square-55x55' /tmp/v12.js && \
               [ "$HEALTH_STATUS" = '200' ] && grep -q 'gemini-3.5-flash-lite' /tmp/health.json && \
               [ "$SESSION_STATUS" = '200' ] && grep -q '"amount":1900' /tmp/session.json && grep -q '"amount":3900' /tmp/session.json; then
              OK='true'
              DETAIL='production-ready'
              break
            fi
            sleep 15
          done
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "index_status=${INDEX_STATUS:-000}" >> "$GITHUB_OUTPUT"
          echo "health_status=${HEALTH_STATUS:-000}" >> "$GITHUB_OUTPUT"
          echo "session_status=${SESSION_STATUS:-000}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record final production smoke
        if: always()
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.smoke.outputs.ok }}
          DETAIL: ${{ steps.smoke.outputs.detail }}
          URL: ${{ steps.smoke.outputs.url }}
          INDEX_STATUS: ${{ steps.smoke.outputs.index_status }}
          HEALTH_STATUS: ${{ steps.smoke.outputs.health_status }}
          SESSION_STATUS: ${{ steps.smoke.outputs.session_status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='.deploy/final-smoke.json';
            const read=(p,max=2000)=>{try{return fs.readFileSync(p,'utf8').slice(0,max)}catch{return ''}};
            const payload=JSON.stringify({
              ok:process.env.OK==='true',
              detail:process.env.DETAIL,
              url:process.env.URL,
              index_status:process.env.INDEX_STATUS,
              health_status:process.env.HEALTH_STATUS,
              session_status:process.env.SESSION_STATUS,
              health_body:read('/tmp/health.json'),
              session_body:read('/tmp/session.json'),
              source_sha:context.sha,
              recorded_at:new Date().toISOString()
            },null,2)+'\n';
            let sha;
            try{const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path});sha=current.data.sha}catch(error){if(error.status!==404)throw error}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'chore: record final Cardcraft production smoke [skip ci]',content:Buffer.from(payload).toString('base64'),sha});
